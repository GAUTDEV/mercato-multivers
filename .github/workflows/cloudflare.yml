name: Deploy Mercato Multivers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || 'f1dc51f0658f7232f94d267ddf5e4c68' }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deployment access
        shell: bash
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Configure the repository secret $key before deploying."
              exit 1
            fi
          done
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Resolve existing game database
        if: env.CLOUDFLARE_D1_DATABASE_ID == ''
        shell: bash
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm exec wrangler d1 list --json > "$RUNNER_TEMP/mercato-d1.json"
          node --input-type=module <<'NODE'
          import {readFileSync, appendFileSync} from 'node:fs';
          import path from 'node:path';
          const databases = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'mercato-d1.json'), 'utf8'));
          if (!Array.isArray(databases)) throw new Error('Unexpected Cloudflare database list.');
          const matches = databases.filter(database => database.name === 'mercato-multivers');
          if (matches.length !== 1) throw new Error('Expected exactly one existing mercato-multivers database; no database was changed.');
          const id = matches[0].uuid;
          if (typeof id !== 'string' || !/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(id)) throw new Error('The existing game database has no valid UUID.');
          appendFileSync(process.env.GITHUB_ENV, 'CLOUDFLARE_D1_DATABASE_ID=' + id + '\n');
          console.log('Selected the existing mercato-multivers database.');
          NODE
      - run: pnpm exec tsc --noEmit
      - run: node tests/run-engine-tests.mjs
      - run: node --test tests/api.test.mjs
      - run: pnpm run build:cloudflare
      - run: pnpm run deploy:cloudflare
